<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrusela</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100 flex justify-center items-center min-h-screen">
    <!-- Carrusel -->
    <section class="relative w-full max-w-7xl">
        <div class="overflow-hidden rounded-xl shadow-2xl">
            <div id="carousel" class="flex transition-transform duration-500">
                <div class="min-w-full bg-cover bg-center h-[600px] flex items-center justify-center text-white" style="background-image: url('images.jfif')">
                    <div class="bg-black bg-opacity-50 p-8 rounded-xl text-center">
                        <h2 class="text-5xl font-bold mb-3">Instituto Técnico Jesús María</h2>
                        <p class="text-xl">Formando profesionales desde 1990</p>
                    </div>
                </div>
                <div class="min-w-full bg-cover bg-center h-[600px] flex items-center justify-center text-white" style="background-image: url('images (1).jfif')">
                    <div class="bg-black bg-opacity-50 p-8 rounded-xl text-center">
                        <h2 class="text-5xl font-bold mb-3">Telecomunicaciones</h2>
                        <p class="text-xl">Innovación en redes</p>
                    </div>
                </div>
                <div class="min-w-full bg-cover bg-center h-[600px] flex items-center justify-center text-white" style="background-image: url('m6.jpg')">
                    <div class="bg-black bg-opacity-50 p-8 rounded-xl text-center">
                        <h2 class="text-5xl font-bold mb-3">Sistemas Informáticos</h2>
                        <p class="text-xl">Mundo digital</p>
                    </div>
                </div>
                <div class="min-w-full bg-cover bg-center h-[600px] flex items-center justify-center text-white" style="background-image: url('images.jfif')">
                    <div class="bg-black bg-opacity-50 p-8 rounded-xl text-center">
                        <h2 class="text-5xl font-bold mb-3">Secretariado Ejecutivo</h2>
                        <p class="text-xl">Gestión profesional</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Navegación -->
        <button id="prevBtn" class="absolute top-1/2 left-6 -translate-y-1/2 bg-blue-600 text-white p-4 rounded-full hover:bg-blue-700"><i class="fas fa-chevron-left"></i></button>
        <button id="nextBtn" class="absolute top-1/2 right-6 -translate-y-1/2 bg-blue-600 text-white p-4 rounded-full hover:bg-blue-700"><i class="fas fa-chevron-right"></i></button>
        <div class="absolute bottom-6 left-1/2 -translate-x-1/2 flex space-x-3">
            <span class="dot w-4 h-4 bg-white rounded-full cursor-pointer opacity-75 hover:opacity-100" data-slide="0"></span>
            <span class="dot w-4 h-4 bg-white rounded-full cursor-pointer opacity-75 hover:opacity-100" data-slide="1"></span>
            <span class="dot w-4 h-4 bg-white rounded-full cursor-pointer opacity-75 hover:opacity-100" data-slide="2"></span>
            <span class="dot w-4 h-4 bg-white rounded-full cursor-pointer opacity-75 hover:opacity-100" data-slide="3"></span>
        </div>
    </section>

    <!-- JavaScript -->
    <script>
        const carousel = document.getElementById('carousel'), prevBtn = document.getElementById('prevBtn'), nextBtn = document.getElementById('nextBtn'), dots = document.querySelectorAll('.dot');
        let currentSlide = 0, totalSlides = carousel.children.length;

        function updateCarousel() {
            carousel.style.transform = `translateX(-${currentSlide * 100}%)`;
            dots.forEach((d, i) => d.classList.toggle('bg-blue-600', i === currentSlide));
        }

        prevBtn.addEventListener('click', () => { currentSlide = (currentSlide - 1 + totalSlides) % totalSlides; updateCarousel(); });
        nextBtn.addEventListener('click', () => { currentSlide = (currentSlide + 1) % totalSlides; updateCarousel(); });
        dots.forEach(d => d.addEventListener('click', () => { currentSlide = +d.dataset.slide; updateCarousel(); }));
        setInterval(() => { currentSlide = (currentSlide + 1) % totalSlides; updateCarousel(); }, 5000);
        updateCarousel();
    </script>
</body>
</html>
